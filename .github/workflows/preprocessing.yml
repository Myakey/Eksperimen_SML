name: Data Preprocessing Automation

on:
  push:
    branches:
      - main
    paths:
      - 'airplane_satisfaction_raw/**'
      - 'preprocessing/automate_*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Dependencies
        run: |
          $HOME/.cargo/bin/uv pip install --system pandas numpy scikit-learn

      - name: Execute Preprocessing Script
        run: python preprocessing/automate_Dymasius-Rendragraha.py

      - name: Commit and Push Processed Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Generate preprocessed dataset"
          file_pattern: "preprocessing/**/*.csv"